services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        INSTALL_AI_EXTRAS: ${INSTALL_AI_EXTRAS:-0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOPIA_DB_PATH: /app/data/sopia.sqlite3
      SOPIA_UPLOAD_DIR: /app/data/uploads
      SOPIA_DATA_DIR: /app/seed_data
      SOPIA_E5_LOCAL_ONLY: ${SOPIA_E5_LOCAL_ONLY:-1}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_data:/app/data
      - model_data:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      - qdrant

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s

  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  api_data:
  qdrant_data:
  ollama_data:
  model_data:
